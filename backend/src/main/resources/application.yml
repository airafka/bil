spring:
  application:
    name: billing-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing}
    username: ${DB_USER:billing}
    password: ${DB_PASSWORD:billing}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
